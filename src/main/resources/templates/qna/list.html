<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Q&A 게시판 - Homepick</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="mb-4">
        <h2 class="fw-bold">Q&A 게시판</h2>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 text-center align-middle">
                <thead class="table-dark">
                    <tr>
                        <th style="width: 10%;">번호</th>
                        <th style="width: 45%;">제목</th>
                        <th style="width: 15%;">작성자</th>
                        <th style="width: 15%;">상태</th>
                        <th style="width: 15%;">작성일</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(qnaList)}">
                        <td colspan="5" class="py-4 text-muted">등록된 질문이 없습니다.</td>
                    </tr>
                    <tr th:each="qna : ${qnaList}">
                        <!-- 번호 -->
                        <td th:text="${qna.id}">1</td>

                        
                        <!-- 제목 -->
                        <td class="text-start" th:text="${qna.title}">제목입니다</td>
                        
                        <!-- 작성자 -->
                        <td th:text="${qna.writer}">작성자</td>

                        <!-- 처리 상태 배지 -->
                        <td>
                            <span th:if="${qna.status == '답변완료'}"
                                  class="badge bg-success"
                                  th:text="${qna.status}">답변완료</span>
                            <span th:unless="${qna.status == '답변완료'}"
                                  class="badge bg-secondary"
                                  th:text="${qna.status}">대기중</span>
                        </td>

                        <!-- 작성일 -->
                        <td th:text="${qna.createdAt != null ? #temporals.format(qna.createdAt, 'yyyy-MM-dd HH:mm') : ''}">2026-09-23</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
