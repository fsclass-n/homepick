<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>테스트 - 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container" style="max-width: 380px;">
        <div class="card shadow-sm border-0 p-4">
            <h4 class="fw-bold text-center mb-3">로그인</h4>

            <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>

            <form th:action="@{/member/login}" method="post">
                <div class="mb-3">
                    <label class="form-label small">이메일</label>
                    <input type="email" name="email" class="form-control" placeholder="name@domain.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small">비밀번호</label>
                    <input type="password" name="password" class="form-control" placeholder="비밀번호 입력" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 mt-2">로그인</button>
            </form>

            <div class="text-center mt-3">
                <a th:href="@{/member/register}" class="text-decoration-none small text-muted">계정이 없으신가요? 회원가입</a>
            </div>
        </div>
    </div>
</body>
</html>
