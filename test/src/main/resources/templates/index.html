<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>테스트 - 홈</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container text-center" style="max-width: 420px;">
        <div class="card shadow-sm border-0 p-4">
            <h4 class="fw-bold mb-3">홈</h4>

            <div th:if="${user != null}">
                <p><span th:text="${user.name}"></span>님, 환영합니다!</p>
                <a th:href="@{/member/logout}" class="btn btn-outline-secondary w-100">로그아웃</a>
            </div>

            <div th:if="${user == null}">
                <p class="text-muted">로그인이 필요합니다.</p>
                <a th:href="@{/member/login}" class="btn btn-primary w-100 mb-2">로그인</a>
                <a th:href="@{/member/register}" class="btn btn-outline-primary w-100">회원가입</a>
            </div>
        </div>
    </div>
</body>
</html>
