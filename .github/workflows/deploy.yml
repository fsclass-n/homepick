name: Deploy homepick to AWS EC2

on:
  push:
    branches: [ "main" ] # homepick은 레포 루트가 프로젝트이므로 main 푸시 시 항상 배포

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2. 이미지 빌드 및 푸시 (레포 루트의 Dockerfile 사용)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/homepick:latest

      # 3. SSH 접속하여 EC2에 배포
      - name: SSH Remote Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 기존 컨테이너 중지 및 삭제
            docker stop homepick || true
            docker rm homepick || true
            docker image rm ${{ secrets.DOCKERHUB_USERNAME }}/homepick:latest || true
            
            # 새 이미지 Pull 및 실행 (80포트로 접속하면 내부 8080으로 연결)
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/homepick:latest
            docker run -d --name homepick -p 80:8080 \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/homepick:latest
            
            # 불필요한 이미지 정리
            docker image prune -f
